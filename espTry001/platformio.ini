; PlatformIO Project Configuration File
; 详情请参考: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare28

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; 两块板都使用 ESP32-S3 原生 USB CDC，GPIO43/44 留给 RS485。
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; 编译前生成版本号，并把 JSON 传感器配置转换为固件内置 C++ 表。
extra_scripts =
    pre:get_git_version.py
    pre:generate_sensor_profiles.py

; 指定拉取兼容的、稳定的 1.4.7 版本图形库
lib_deps =
    moononournation/GFX Library for Arduino @ 1.4.7
    4-20ma/ModbusMaster @ ^2.0.1
    bblanchon/ArduinoJson @ 7.4.3

[env:esp32s3]
build_flags =
    ${env.build_flags}
    -D PYXIS_BOARD_WAVESHARE_147=1

[env:waveshare28]
; ESP32-S3R8 + external 16MB QIO Flash and 8MB OPI PSRAM.
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -D PYXIS_BOARD_WAVESHARE_28=1
    -D PYXIS_TOUCH_CST3530=1
    -D BOARD_HAS_PSRAM
